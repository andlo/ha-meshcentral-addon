{
  "name": "MeshCentral",
  "version": "0.2.3",
  "slug": "meshcentral",
  "description": "Self-hosted remote device management — monitor and control your PCs from Home Assistant",
  "url": "https://github.com/andlo/ha-meshcentral-addon",
  "arch": ["aarch64", "amd64", "armhf", "armv7", "i386"],
  "startup": "application",
  "boot": "auto",
  "init": false,
  "ports": {
    "443/tcp": 4430,
    "4433/tcp": 4433
  },
  "ports_description": {
    "443/tcp": "MeshCentral web interface (HTTPS)",
    "4433/tcp": "Intel AMT / MPS port"
  },
  "options": {
    "server_mode": "lan",
    "new_accounts": true,
    "domain_title": "MeshCentral",
    "session_time": 60,
    "tls_offload": false,
    "web_rtc": false,
    "compression": false,
    "self_update": false,
    "maintenance_mode": false,
    "smtp_enabled": false
  },
  "schema": {
    "server_mode": "list(lan|wan|hybrid)",
    "new_accounts": "bool",
    "domain_title": "str",
    "domain_title2": "str?",
    "hostname": "str?",
    "cert_url": "str?",
    "session_key": "password?",
    "session_time": "int",
    "tls_offload": "bool",
    "trusted_proxy": "str?",
    "user_allowed_ip": "str?",
    "user_blocked_ip": "str?",
    "agent_allowed_ip": "str?",
    "agent_blocked_ip": "str?",
    "web_rtc": "bool",
    "compression": "bool",
    "self_update": "bool",
    "maintenance_mode": "bool",
    "smtp_enabled": "bool",
    "smtp_host": "str?",
    "smtp_port": "int?",
    "smtp_from": "str?",
    "smtp_user": "str?",
    "smtp_pass": "password?",
    "smtp_tls": "bool?"
  },
  "map": [
    "data:rw"
  ],
  "image": "ghcr.io/andlo/meshcentral-addon-{arch}",
  "homeassistant_api": false,
  "hassio_api": false
}
