{
  "name": "MeshCentral",
  "version": "0.2.11",
  "slug": "meshcentral",
  "description": "Self-hosted remote device management — monitor and control your PCs from Home Assistant",
  "url": "https://github.com/andlo/ha-meshcentral-addon",
  "arch": ["aarch64", "amd64", "armhf", "armv7", "i386"],
  "startup": "application",
  "boot": "auto",
  "init": false,
  "ports": {
    "4430/tcp": 4430,
    "4431/tcp": 4431,
    "4433/tcp": 4433
  },
  "ports_description": {
    "4430/tcp": "MeshCentral web interface (HTTPS)",
    "4431/tcp": "MeshCentral HTTP redirect → HTTPS",
    "4433/tcp": "Intel AMT / MPS port"
  },
  "options": {
    "server_mode": "lan",
    "cert_url": "",
    "new_accounts": true,
    "new_accounts_pass": "",
    "domain_title": "MeshCentral",
    "domain_title2": "",
    "site_style": 2,
    "welcome_text": "",
    "session_time": 60,
    "allow_login_token": false,
    "tls_offload": false,
    "trusted_proxy": "",
    "web_rtc": false,
    "compression": true,
    "allow_high_quality_desktop": true,
    "self_update": false,
    "maintenance_mode": false,
    "no_2fa": false,
    "max_invalid_login_count": 10,
    "max_invalid_login_time": 10,
    "auto_remove_inactive_devices": 0,
    "guest_device_sharing": true,
    "allow_framing": false,
    "user_allowed_ip": "",
    "user_blocked_ip": "",
    "agent_allowed_ip": "",
    "agent_blocked_ip": "",
    "agent_port": 0,
    "mps_port": 4433,
    "backup_interval_hours": 24,
    "backup_keep_days": 10,
    "backup_zip_password": "",
    "smtp_enabled": false,
    "smtp_host": "",
    "smtp_port": 587,
    "smtp_from": "",
    "smtp_user": "",
    "smtp_pass": "",
    "smtp_tls": true
  },
  "schema": {
    "server_mode": "list(lan|wan|hybrid)",
    "cert_url": "str?",
    "new_accounts": "bool",
    "new_accounts_pass": "str?",
    "domain_title": "str",
    "domain_title2": "str?",
    "site_style": "list(1|2)",
    "welcome_text": "str?",
    "session_time": "int",
    "allow_login_token": "bool",
    "tls_offload": "bool",
    "trusted_proxy": "str?",
    "web_rtc": "bool",
    "compression": "bool",
    "allow_high_quality_desktop": "bool",
    "self_update": "bool",
    "maintenance_mode": "bool",
    "no_2fa": "bool",
    "max_invalid_login_count": "int",
    "max_invalid_login_time": "int",
    "auto_remove_inactive_devices": "int",
    "guest_device_sharing": "bool",
    "allow_framing": "bool",
    "user_allowed_ip": "str?",
    "user_blocked_ip": "str?",
    "agent_allowed_ip": "str?",
    "agent_blocked_ip": "str?",
    "agent_port": "int",
    "mps_port": "int",
    "backup_interval_hours": "int",
    "backup_keep_days": "int",
    "backup_zip_password": "password?",
    "smtp_enabled": "bool",
    "smtp_host": "str?",
    "smtp_port": "int?",
    "smtp_from": "str?",
    "smtp_user": "str?",
    "smtp_pass": "password?",
    "smtp_tls": "bool?"
